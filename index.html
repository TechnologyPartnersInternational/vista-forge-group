        <h1>Technology Partners International (TPI) — Environmental Consultancy Company in Nigeria</h1>
        <p>Technology Partners International (TPI) is Nigeria's leading environmental consultancy and engineering company, established in 1992. We are an ISO-certified environmental consulting firm based in Lagos, Nigeria, providing comprehensive environmental services across Nigeria, West Africa, and beyond.</p>

        <h2>Environmental Impact Assessment (EIA) Services in Nigeria</h2>
        <p>TPI is one of the top environmental impact assessment companies in Nigeria. We conduct Environmental Impact Assessments (EIA), Environmental Evaluation Studies (EES), and Environmental Audits for projects across the oil &amp; gas, mining, infrastructure, and power sectors. With a 98% permit approval success rate and over 30 years of experience, we are the trusted EIA consultant in Nigeria.</p>

        <h2>Our Environmental Consultancy Services</h2>
        <ul>
          <li>Environmental Impact Assessment (EIA) — Full ESHIA studies for regulatory compliance</li>
          <li>Environmental Compliance Monitoring — Air, water, and soil quality monitoring</li>
          <li>Environmental Site Assessment &amp; Characterization</li>
          <li>Climate Change, Sustainability &amp; GHG Reporting</li>
          <li>Health, Social Engagement &amp; Resettlement (SIA, RAP)</li>
          <li>Air Quality &amp; Acoustics Monitoring</li>
          <li>Clean-Up &amp; Remediation Services — Oil spill remediation Nigeria</li>
          <li>Hydrological &amp; Hydrogeological Services</li>
          <li>Geophysical &amp; Geotechnical Services</li>
          <li>GIS Mapping &amp; Remote Sensing</li>
        </ul>

        <h2>Environmental Laboratory Services in Nigeria</h2>
        <p>TPI operates an ISO/IEC 17025:2017 accredited environmental laboratory in Nigeria. We provide water quality testing, soil analysis, air monitoring, crude oil assays, eco-toxicity studies, and geochemical fingerprinting. Our laboratory services include mobile laboratory units for remote site testing.</p>

        <h2>Waste Management Services in Nigeria</h2>
        <p>TPI provides end-to-end waste management solutions in Nigeria including integrated solid waste management, incineration systems, thermal desorption, and waste policy formulation for the oil &amp; gas and industrial sectors.</p>

        <h2>Engineering, EPC &amp; Asset Integrity Services</h2>
        <p>TPI delivers multidisciplinary engineering design, procurement, construction management, and asset integrity services for Nigeria's oil &amp; gas and infrastructure sectors.</p>

        <h2>Professional Environmental &amp; HSE Training in Nigeria</h2>
        <p>TPI offers accredited ESG, HSE, and environmental laboratory training programs in Nigeria. Build technical capacity with customized courses from industry experts.</p>

        <h2>ISO Certifications</h2>
        <p>TPI holds ISO 9001:2015, ISO 14001:2015, ISO 45001:2018, and ISO/IEC 17025:2017 certifications.</p>
